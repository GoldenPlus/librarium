<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a3e1d">
  <title>Librarium</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="cabecera">
    <div class="fila">
      <h1>Librarium</h1>
      <button id="btn-recargar" class="icono" type="button" title="Recargar" aria-label="Recargar">⟳</button>
      <button id="btn-ajustes" class="icono" type="button" title="Ajustes" aria-label="Ajustes">⚙</button>
    </div>
    <input id="buscar" type="search" placeholder="Buscar título, autor o ubicación" autocomplete="off" aria-label="Buscar">
    <nav id="pestanas" class="pestanas" role="tablist"></nav>
  </header>

  <main>
    <p id="estado" class="estado" role="status"></p>
    <div class="barra-lista">
      <p id="contador" class="contador"></p>
      <label class="agrupar"><input id="agrupar" type="checkbox"> Agrupar sagas</label>
    </div>
    <ul id="lista" class="lista"></ul>
    <p id="vacio" class="vacio" hidden></p>
  </main>

  <div class="flotantes">
    <button id="btn-escanear-rapido" class="secundario" type="button" aria-label="Escanear un libro">📷</button>
    <button id="btn-alta" type="button">＋ Añadir</button>
  </div>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <!-- Ajustes -->
  <dialog id="dlg-ajustes">
    <form id="form-ajustes" class="formulario">
      <h2>Ajustes</h2>
      <p class="ayuda">Se guardan solo en este dispositivo.</p>
      <label>Tu nombre
        <input name="nombre" required autocomplete="given-name">
      </label>
      <label>Repositorio de datos
        <input name="repo" required placeholder="usuario/coleccion-datos" autocapitalize="off" spellcheck="false">
      </label>
      <label>Token de GitHub
        <input name="token" type="password" required autocomplete="off" spellcheck="false">
      </label>
      <label><span>Clave de Google Books <span class="opcional">(opcional, completa datos de libros)</span></span>
        <input name="google" autocomplete="off" spellcheck="false">
      </label>
      <label><span>Clave de TMDB <span class="opcional">(opcional, para películas y series)</span></span>
        <input name="tmdb" autocomplete="off" spellcheck="false">
      </label>
      <p id="ajustes-error" class="error" role="alert"></p>
      <div class="botones">
        <button id="ajustes-cancelar" type="button" class="secundario">Cancelar</button>
        <button id="ajustes-guardar" type="submit">Guardar y conectar</button>
      </div>
    </form>
  </dialog>

  <!-- Escáner -->
  <dialog id="dlg-escaner" class="escaner">
    <video id="video-escaner" playsinline muted></video>
    <p id="escaner-estado" role="status">Apunta al código de barras del libro.</p>
    <div class="botones">
      <button id="escaner-cancelar" type="button" class="secundario">Cancelar</button>
    </div>
  </dialog>

  <!-- Detalle -->
  <dialog id="dlg-detalle">
    <div id="detalle-contenido" class="detalle"></div>
    <p id="detalle-error" class="error" role="alert"></p>
    <div class="botones">
      <button id="detalle-borrar" type="button" class="peligro">Eliminar</button>
      <span class="hueco"></span>
      <button id="detalle-editar" type="button" class="secundario">Editar</button>
      <button id="detalle-cerrar" type="button">Cerrar</button>
    </div>
  </dialog>

  <!-- Alta -->
  <dialog id="dlg-alta">
    <form id="form-alta" class="formulario" novalidate>
      <h2 id="form-titulo">Añadir</h2>
      <label>Tipo
        <select name="tipo" id="alta-tipo"></select>
      </label>
      <label id="campo-subtipo">Es
        <select name="subtipo">
          <option value="pelicula">Película documental</option>
          <option value="serie">Docuserie</option>
        </select>
      </label>
      <div id="campo-isbn" class="campo-isbn">
        <label for="alta-isbn">ISBN <span class="opcional">(opcional)</span></label>
        <div class="fila-isbn">
          <input id="alta-isbn" name="isbn" inputmode="numeric" autocomplete="off" enterkeyhint="search">
          <button id="btn-buscar-isbn" type="button" class="secundario">Buscar</button>
          <button id="btn-escanear" type="button" class="secundario" aria-label="Escanear código de barras">📷</button>
        </div>
        <p id="isbn-estado" class="ayuda" role="status"></p>
      </div>
      <div id="campo-tmdb" class="campo-isbn">
        <label for="tmdb-buscar">Buscar en TMDB <span class="opcional">(rellena datos, portada y saga)</span></label>
        <div class="fila-isbn">
          <input id="tmdb-buscar" type="search" autocomplete="off" enterkeyhint="search" placeholder="Título de la película o serie">
          <button id="btn-tmdb" type="button" class="secundario">Buscar</button>
        </div>
        <p id="tmdb-estado" class="ayuda" role="status"></p>
        <ul id="tmdb-resultados" class="resultados"></ul>
        <input type="hidden" name="tmdb">
        <input type="hidden" name="temporadas_total">
      </div>
      <img id="alta-portada" class="portada-previa" alt="Portada" hidden>
      <input type="hidden" name="portada">
      <label>Título
        <input name="titulo" required autocomplete="off">
      </label>
      <label><span id="etiqueta-autor">Autor</span>
        <input name="autor" autocomplete="off">
      </label>
      <label>Año
        <input name="anio" type="number" inputmode="numeric" min="0" max="3000">
      </label>
      <label id="campo-temporadas">Temporadas que tenéis
        <span class="fila-isbn">
          <input name="temporadas" placeholder="por ejemplo 1-3, 5" autocomplete="off">
          <button id="btn-todas" type="button" class="secundario" hidden>Todas</button>
        </span>
      </label>
      <label id="campo-formato">Formato
        <input name="formato" list="dl-formatos" autocomplete="off">
      </label>
      <label id="campo-ubicacion">Ubicación
        <input name="ubicacion" list="dl-ubicaciones" required autocomplete="off">
      </label>
      <div id="campo-temporadas-edicion" class="temporadas-edicion">
        <span class="etiqueta">Temporadas</span>
        <div id="filas-temporadas"></div>
        <button id="btn-temporada" type="button" class="secundario">＋ Temporada</button>
      </div>
      <fieldset class="saga">
        <legend>Saga <span class="opcional">(opcional)</span></legend>
        <label class="ancho">Nombre
          <input name="saga" list="dl-sagas" autocomplete="off" placeholder="por ejemplo El Señor de los Anillos">
        </label>
        <label>Número
          <input name="saga_orden" type="number" inputmode="numeric" min="1" max="999">
        </label>
        <label>Total
          <input name="saga_total" type="number" inputmode="numeric" min="1" max="999">
        </label>
      </fieldset>
      <label>Notas
        <textarea name="notas" rows="2"></textarea>
      </label>
      <datalist id="dl-formatos"></datalist>
      <datalist id="dl-ubicaciones"></datalist>
      <datalist id="dl-sagas"></datalist>

      <p id="alta-error" class="error" role="alert"></p>
      <div id="alta-parecidos" class="parecidos" hidden>
        <p></p>
        <ul></ul>
        <button id="alta-forzar" type="button" class="secundario">Añadir igualmente</button>
      </div>

      <div class="botones">
        <button id="alta-cancelar" type="button" class="secundario">Cancelar</button>
        <button id="alta-guardar" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
